<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notepad</title>

  <meta name="theme-color" content="#c8a96e">

  <link rel="manifest" href="notepad_manifest.json">
  <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600&family=Playfair+Display:wght@400;600&family=Space+Mono&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="notepad_stylesheet.css">
</head>

<body>

<div id="breadcrumb"></div>

<header>
  <h3 id="pageTitle">📋  &nbsp;&nbsp;Notepad :</h3>
  <div class="notepad-date" id="dateDisplay"></div>
</header>

      <p id="description-paragraph">Tap the [ new list + ] button and type a name for the list where your notes will be kept. Then tap the [ add note + ] button beside the list title to add a note title. Then tap the note title to type a note.
      </p>

<!-- TOOLBAR ROW — always visible, [ new list + ] reveals input below -->
<div class="toolbar-row" id="listToolbarRow">
  <div class="orange-btn" style="margin: 0px;" id="newListBtn" onclick="show_list_toolbar()">new list +</div>
  <div class="orange-btn" style="margin: 0px;" id="syncBtn" onclick="handle_sync_click()">sync +</div>
</div>
<!-- END TOOLBAR ROW -->

<!-- SHARED INPUT DIVIDER — new list input row, plus hidden import file picker -->
<div id="listAddFields" style="display:none;">

  <input class="text-input" id="newListInput" placeholder="Enter list name...">
  <button class="orange-btn" style="margin: 0px;" onclick="add_category()">＋</button>
</div>

<input
  type="file"
  id="importFileInput"
  accept="application/json"
  style="display:none"
  onchange="import_notes(event)"
>
<!-- END SHARED INPUT DIVIDER -->


<main class="main">


  <div id="notes-list-view">

    <div class="notepad-body">

      <div id="notes-list"></div>

    </div>

  </div>
  <!-- END NOTES LIST VIEW -->

  <div id="note-editor-view" style="display:none;">

    <div class="toolbar-row">
      <h3 id="note-title-display"></h3>
      <button class="orange-btn" id="headerBackBtn" onclick="handleBack()" style="display:none;">← Back</button>
    </div>

    <!-- TOP FORMAT TOOLBAR — structure/block tools -->
    <div class="format-toolbar-top" id="formatToolbarTop">
      <div class="fmt-btn" data-cmd="insertUnorderedList" data-label="Unordered List" onclick="handle_fmt_click(this)">UL</div>
      <div class="fmt-btn" data-cmd="insertOrderedList" data-label="Ordered List" onclick="handle_fmt_click(this)">OL</div>
      <div class="fmt-btn" data-cmd="indent" data-label="Indent" onclick="handle_fmt_click(this)">I</div>
      <div class="fmt-btn" data-cmd="margin" data-label="Margin" onclick="handle_fmt_click(this)">M</div>
      <select class="fmt-select" id="headingSelect" data-label="Heading" onchange="handle_heading_select(this)">
        <option value="">H</option>
        <option value="H1">H1</option>
        <option value="H2">H2</option>
        <option value="H3">H3</option>
        <option value="H4">H4</option>
        <option value="H5">H5</option>
        <option value="H6">H6</option>
      </select>
      <div class="fmt-btn" data-cmd="checkbox" data-label="Checkbox" onclick="handle_fmt_click(this)">C</div>
    </div>
    <!-- END TOP FORMAT TOOLBAR -->

    <div class="notepad-editor-wrap">

      <!-- LEFT SIDE FORMAT TOOLBAR — inline style tools -->
      <div class="format-toolbar-side" id="formatToolbarSide">
        <div class="fmt-btn" data-cmd="bold" data-label="Bold" onclick="handle_fmt_click(this)">B</div>
        <div class="fmt-btn" data-cmd="italic" data-label="Italic" onclick="handle_fmt_click(this)">I</div>
        <div class="fmt-btn" data-cmd="hiliteColor" data-label="Highlight" onclick="handle_fmt_click(this)">HF</div>
        <select class="fmt-select" id="fontSizeSelect" data-label="Font Size" onchange="handle_fontsize_select(this)">
          <option value="">FS</option>
          <option value="1">S</option>
          <option value="3">M</option>
          <option value="5">L</option>
          <option value="7">XL</option>
        </select>
        <select class="fmt-select" id="fontColorSelect" data-label="Font Color" onchange="handle_fontcolor_select(this)">
          <option value="">FC</option>
          <option value="black">Black</option>
          <option value="red">Red</option>
          <option value="blue">Blue</option>
          <option value="green">Green</option>
          <option value="orange">Orange</option>
        </select>
      </div>
      <!-- END LEFT SIDE FORMAT TOOLBAR -->

      <div class="notepad-body">
        <div id="note-textarea" contenteditable="true" data-placeholder="Your note goes here."></div>
      </div>

    </div>
    <!-- END editor wrap -->

    <div id="fmtTooltip" class="fmt-tooltip" style="display:none;"></div>

  </div>
  <!-- END NOTE EDITOR VIEW -->

</main>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="notepad_sync.js"></script>
  <script src="notepad_engine.js"></script>

<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('notepad_service_worker.js');
  }
</script>
<script src="//cdn.jsdelivr.net/npm/eruda"></script>
<script>eruda.init();</script>

</body>
</html>
