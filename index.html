<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notepad</title>

  <meta name="theme-color" content="#c8a96e">

  <link rel="manifest" href="notepad_manifest.json">
  <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600&family=Playfair+Display:wght@400;600&family=Space+Mono&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="notepad_stylesheet.css">
</head>

<body>

<div id="breadcrumb"></div>

<header>
  <h3 id="pageTitle">📋  &nbsp;&nbsp;Notepad :</h3>
  <div class="notepad-date" id="dateDisplay"></div>
</header>

      <p id="description-paragraph">Tap the [ new list + ] button and type a name for the list where your notes will be kept. Then tap the [ add note + ] button beside the list title to add a note title. Then tap the note title to type a note.
      </p>

<!-- TOOLBAR ROW — always visible, [ new list + ] reveals input below -->
<div class="toolbar-row" id="listToolbarRow">
  <div class="orange-btn" style="margin: 0px;" id="newListBtn" onclick="show_list_toolbar()">new list +</div>
  <div class="orange-btn" style="margin: 0px;" id="syncBtn" onclick="handle_sync_click()">sync +</div>
</div>
<!-- END TOOLBAR ROW -->

<!-- SHARED INPUT DIVIDER — new list input row, plus hidden import file picker -->
<div id="listAddFields" style="display:none;">

  <input class="text-input" id="newListInput" placeholder="Enter list name...">
  <button class="orange-btn" style="margin: 0px;" onclick="add_category()">＋</button>
</div>

<input
  type="file"
  id="importFileInput"
  accept="application/json"
  style="display:none"
  onchange="import_notes(event)"
>
<!-- END SHARED INPUT DIVIDER -->


<main class="main">


  <div id="notes-list-view">

    <div class="notepad-body">

      <div id="notes-list"></div>

    </div>

  </div>
  <!-- END NOTES LIST VIEW -->

  <div id="note-editor-view" style="display:none;">

    <div class="note-editor-sticky-toolbar">

      <div class="toolbar-row">
        <h3 id="note-title-display"></h3>
        <button class="orange-btn" id="headerBackBtn" onclick="handleBack()" style="display:none;">← Back</button>
      </div>

      <!-- SINGLE FORMAT TOOLBAR -->
      <div class="format-toolbar-single" id="formatToolbarSingle">
        <div class="fmt-btn" data-cmd="bold" data-label="Bold" onmousedown="event.preventDefault()" onclick="handle_fmt_click(this)">-B-</div>
        <div class="fmt-btn" data-cmd="italic" data-label="Italic" onmousedown="event.preventDefault()" onclick="handle_fmt_click(this)">-ITA-</div>
        <div class="fmt-btn" data-cmd="underline" data-label="Underline" onmousedown="event.preventDefault()" onclick="handle_fmt_click(this)">-Un-</div>
        <div class="fmt-btn" id="alignBtn" data-label="Align" onmousedown="event.preventDefault()" onclick="handle_align_click(this)">-ALI-</div>
        <div class="fmt-btn" data-cmd="indent" data-label="Indent" onmousedown="event.preventDefault()" onclick="handle_fmt_click(this)">-IND-</div>

        <select class="fmt-select" id="fontSelect" data-label="Font" onchange="handle_font_select(this)">
          <option value="">Font:</option>
          <optgroup label="Font Color">
            <option value="color:black">Black</option>
            <option value="color:red">Red</option>
            <option value="color:blue">Blue</option>
            <option value="color:green">Green</option>
            <option value="color:orange">Orange</option>
          </optgroup>
          <optgroup label="Font Size">
            <option value="size:1">Small</option>
            <option value="size:3">Medium</option>
            <option value="size:5">Large</option>
            <option value="size:7">X-Large</option>
          </optgroup>
        </select>

        <select class="fmt-select" id="highlightSelect" data-label="Highlight" onchange="handle_highlight_select(this)">
          <option value="">Hi-Li:</option>
          <optgroup label="Color :">
            <option value="text:red">Red</option>
            <option value="text:blue">Blue</option>
            <option value="text:green">Green</option>
            <option value="text:yellow">Yellow</option>
            <option value="text:orange">Orange</option>
          </optgroup>
          <optgroup label="BG Color :">
            <option value="bg:red">Red</option>
            <option value="bg:blue">Blue</option>
            <option value="bg:green">Green</option>
            <option value="bg:yellow">Yellow</option>
            <option value="bg:orange">Orange</option>
          </optgroup>
        </select>

        <select class="fmt-select" id="listSelect" data-label="Lis :" onchange="handle_list_select(this)">
          <option value="">List :</option>
          <optgroup label="UL">
            <option value="ul:disc">Bulleted</option>
            <option value="ul:circle">Circle</option>
            <option value="ul:square">Square</option>
          </optgroup>
          <optgroup label="OL">
            <option value="ol:decimal">Numbered</option>
            <option value="ol:lower-alpha">Lettered</option>
            <option value="ol:upper-roman">Roman</option>
          </optgroup>
        </select>
        <div class="fmt-btn" id="listToggleBtn" data-label="List" onmousedown="event.preventDefault()" onclick="handle_list_toggle_click()" style="display:none;"></div>

        <div class="fmt-btn" data-cmd="checkbox" data-label="Checkbox" onmousedown="event.preventDefault()" onclick="handle_fmt_click(this)">✓</div>
      </div>
      <!-- END SINGLE FORMAT TOOLBAR -->

    </div>
    <!-- END sticky toolbar wrap -->

    <div class="notepad-body">
      <div id="note-textarea" contenteditable="true" data-placeholder="Your note goes here."></div>
    </div>

    <div id="fmtTooltip" class="fmt-tooltip" style="display:none;"></div>

  </div>
  <!-- END NOTE EDITOR VIEW -->

</main>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="notepad_sync.js"></script>
  <script src="notepad_engine.js"></script>

<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('notepad_service_worker.js');
  }
</script>
<script src="//cdn.jsdelivr.net/npm/eruda"></script>
<script>eruda.init();</script>

</body>
</html>
