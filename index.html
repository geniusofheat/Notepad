<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notepad</title>

  <meta name="theme-color" content="#c8a96e">

  <link rel="manifest" href="notepad_manifest.json">
  <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600&family=Playfair+Display:wght@400;600&family=Space+Mono&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="notepad_stylesheet.css">
</head>

<body>

<div id="breadcrumb"></div>

<header>
  <h3 id="pageTitle">📋  &nbsp;&nbsp;Notepad :</h3>
  <div class="notepad-date" id="dateDisplay"></div>
</header>

      <p id="description-paragraph">Tap the [ new list + ] button and type a name for the list where your notes will be kept. Then tap the [ add note + ] button beside the list title to add a note title. Then tap the note title to type a note.
      </p>

<!-- TOOLBAR ROW — always visible, [ new list + ] reveals input below -->
<div class="toolbar-row" id="listToolbarRow">
  <div class="orange-btn" style="margin: 0px;" id="newListBtn" onclick="show_list_toolbar()">new list +</div>
  <div class="orange-btn" style="margin: 0px;" id="exportBtn" onclick="export_notes()">export +</div>
  <div class="orange-btn" style="margin: 0px;" id="importBtn" onclick="trigger_import()">import +</div>
  <div class="orange-btn" style="margin: 0px;" id="syncBtn" onclick="handle_sync_click()">sync +</div>
</div>
<!-- END TOOLBAR ROW -->

<!-- SHARED INPUT DIVIDER — new list input row, plus hidden import file picker -->
<div id="listAddFields" style="display:none;">

  <input class="text-input" id="newListInput" placeholder="Enter list name...">
  <button class="orange-btn" style="margin: 0px;" onclick="add_category()">＋</button>
</div>

<input
  type="file"
  id="importFileInput"
  accept="application/json"
  style="display:none"
  onchange="import_notes(event)"
>
<!-- END SHARED INPUT DIVIDER -->


<main class="main">


  <div id="notes-list-view">

    <div class="notepad-body">

      <div id="notes-list"></div>

    </div>

  </div>
  <!-- END NOTES LIST VIEW -->

  <div id="note-editor-view" style="display:none;">

    <div class="toolbar-row">
      <h3 id="note-title-display"></h3>
      <button class="orange-btn" id="headerBackBtn" onclick="handleBack()" style="display:none;">← Back</button>
    </div>

    <div class="notepad-body">
      <textarea id="note-textarea" placeholder="Your note goes here."></textarea>
    </div>

  </div>
  <!-- END NOTE EDITOR VIEW -->

</main>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="notepad_sync.js"></script>
  <script src="notepad_engine.js"></script>

<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('notepad_service_worker.js');
  }
</script>
<script src="//cdn.jsdelivr.net/npm/eruda"></script>
<script>eruda.init();</script>

</body>
</html>
