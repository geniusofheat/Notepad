<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notepad</title>

  <link rel="manifest" href="notepad_manifest.json">
  <meta name="theme-color" content="#c8a96e">

  <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600&family=Playfair+Display:wght@400;600&family=Space+Mono&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="notepad.css">
</head>

<body>

<header>
  <div class="header-left">
    <button class="orange-btn" id="headerBackBtn" onclick="handleBack()" style="display:none;">← Back</button>
  </div>
  <div class="header-right">
    <div class="notepad-date" id="dateDisplay"></div>
  </div>
  <div class="card flex-row"></div>
</header>

<main class="main">

  <!-- NOTES LIST VIEW -->
  <div id="notes-list-view">

    <!-- TITLE ROW -->
    <div class="toolbar-row">
      <div class="notepad-title">Notes :</div>
    </div>
    <!-- END TITLE ROW -->

    <div class="notepad-body">

      <!-- RENDERED NOTE CARDS -->
      <div id="notes-list"></div>
      <!-- END RENDERED NOTE CARDS -->

      <!-- ADD NOTE ROW — input hidden until + is tapped -->
      <div class="note-card note-add-row" id="noteAddRow">
        <div class="note-add-content">
          <input id="newNoteInput" class="note-add-input" placeholder="Add a new note...">
        </div>
        <button class="orange-btn-44" id="addNoteBtn" onclick="handleAddNoteBtn()">＋</button>
      </div>
      <!-- END ADD NOTE ROW -->

    </div>

  </div>
  <!-- END NOTES LIST VIEW -->


  <!-- NOTE EDITOR VIEW -->
  <div id="note-editor-view" style="display:none;">

    <!-- EDITOR TITLE ROW -->
    <div class="toolbar-row">
      <div class="notepad-title" id="note-title-display"></div>
      <button class="orange-btn-44" onclick="voiceInputToNote()">🎤</button>
      <button class="orange-btn" onclick="deleteCurrentNote()">🗑</button>
    </div>
    <!-- END EDITOR TITLE ROW -->

    <div class="notepad-body">
      <textarea id="note-textarea" placeholder="Now you can begin typing your note into this area."></textarea>
    </div>

  </div>
  <!-- END NOTE EDITOR VIEW -->

</main>

<script src="notepad.js"></script>

<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('notepad_sw.js');
  }
</script>

<script src="//cdn.jsdelivr.net/npm/eruda"></script>
<script>eruda.init();</script>

</body>
</html>
