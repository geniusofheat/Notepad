<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notepad — Sign In</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;900&family=Crimson+Pro:ital,wght@0,400;1,400&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
:root { --gold: #c8a96e; --text: #fefeff; }
html, body { min-height: 100%; }
body { background: linear-gradient(160deg, rgba(0,0,148,0.9) 0%, rgba(22,46,95,0.80) 10%, rgba(0,0,0,0.90) 100%) fixed;
  font-family: 'Crimson Pro', serif; color: var(--text); padding: 24px 14px; }
.card { max-width: 420px; margin: 40px auto 0; border: 2px solid gold; border-radius: 5px; padding: 22px 18px; text-align: center;
  background: linear-gradient(160deg, rgba(0,50,120,0.35) 0%, rgba(65,156,185,0.05) 80%, rgba(50,50,50,0.30) 100%); }
h2 { font-family: 'Playfair Display', serif; font-weight: 600; color: var(--gold); font-size: 26px; }
hr { border: 0; border-top: 1px solid rgba(200,169,110,0.55); margin: 14px 0; }
p { font-size: 18px; line-height: 1.4; margin-bottom: 14px; }
.google-btn { display: flex; align-items: center; width: 100%; max-width: 300px; margin: 6px auto; padding: 0; height: 44px; background: #fff;
  border: 1px solid #dadce0; border-radius: 4px; cursor: pointer; overflow: hidden; font-family: Roboto, Arial, sans-serif; }
.google-btn .g-box { display: flex; align-items: center; justify-content: center; width: 42px; height: 42px; background: #fff; border-right: 1px solid #dadce0; flex: none; }
.google-btn .g-logo { width: 20px; height: 20px; }
.google-btn .g-text { flex: 1; background: #fff; color: #3c4043; font-size: 15px; font-weight: 500; letter-spacing: .25px; text-align: center; }
.google-btn:active { opacity: .85; }
#sign_in_error { font-size: 14px; color: #ff9b9b; min-height: 18px; margin: 10px 0 0; }
</style>
</head>
<body>
<div class="card">
  <h2 id="card-title">Sign In</h2>
  <hr>
  <p id="card-text">Sign in with Google to open your notes. Each account keeps its own notes.</p>
  <button type="button" id="google-sign-in-btn" class="google-btn"><span class="g-box"><svg class="g-logo" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg></span><span class="g-text">Sign in with Google</span></button>
  <p id="sign_in_error"></p>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script>
// Coming from "Create an Account" on the features page: show the create-account wording.
if (new URLSearchParams(location.search).get('card') === 'create-account') {
  document.getElementById('card-title').textContent = 'Create Account';
  document.getElementById('card-text').textContent = 'Continue with Google to create your account. Your notes will be kept under it.';
  document.getElementById('google-sign-in-btn').querySelector('.g-text').textContent = 'Continue with Google';
}
const firebaseConfig = {
  apiKey: "AIzaSyCGvpWKfkSQapFEwx6lMr6kAMFQ7Ir-sNQ",
  authDomain: "notepad-fba.firebaseapp.com",
  projectId: "notepad-fba",
  storageBucket: "notepad-fba.firebasestorage.app",
  messagingSenderId: "570988410605",
  appId: "1:570988410605:web:a70688966f8c6035cc3ee4"
};
const err_box = document.getElementById('sign_in_error');
const to_home = () => { try { localStorage.setItem('notepad_signed_in', '1'); } catch (e) {} location.replace('notepad.html'); };

if (typeof firebase === 'undefined') {
  err_box.textContent = 'No internet connection. Connect and reload to sign in.';
} else {
  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();

  // Already signed in with Google, or just back from a redirect sign-in: go straight to the notes.
  auth.getRedirectResult().catch(() => {});
  auth.onAuthStateChanged(user => { if (user && !user.isAnonymous) to_home(); });

  document.getElementById('google-sign-in-btn').addEventListener('click', async () => {
    err_box.textContent = '';
    const provider = new firebase.auth.GoogleAuthProvider();
    provider.setCustomParameters({ prompt: 'select_account' });
    try {
      await auth.signInWithPopup(provider);
    } catch (err) {
      const code = err && err.code;
      if (code === 'auth/popup-blocked' || code === 'auth/operation-not-supported-in-this-environment') {
        try { await auth.signInWithRedirect(provider); return; } catch (e) { /* fall through */ }
      }
      if (code === 'auth/popup-closed-by-user' || code === 'auth/cancelled-popup-request') return;
      err_box.textContent = code === 'auth/network-request-failed' ? 'No internet connection.' : 'Sign-in failed. Please try again.';
    }
  });
}
</script>
</body>
</html>
